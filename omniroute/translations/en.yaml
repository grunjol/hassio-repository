configuration:
  PORT:
    name: API Port
    description: Port for the OmniRoute API and dashboard (default 20128)
  AUTH_COOKIE_SECURE:
    name: Secure Auth Cookies
    description: Set to true when OmniRoute is behind an HTTPS reverse proxy
  OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS:
    name: Allow Private Providers
    description: Set to true to allow local/self-hosted providers (Ollama, vLLM, LM Studio)
  OMNIROUTE_MEMORY_MB:
    name: Memory Limit (MB)
    description: Maximum Node.js heap memory in megabytes. Increase for heavy usage with large prompts and many concurrent connections
